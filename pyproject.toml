[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-factory-lab"
version = "0.1.0"
description = "Control plane for AI Factory Lab: orchestration of autonomous coding agents over external product repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AI Factory Lab" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
factory = "factory.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["factory"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
